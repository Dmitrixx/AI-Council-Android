name: Import, test and build AI Council Android

on:
  push:
    branches: [main]
    paths:
      - 'AI-Council-Android-v*-files.zip'

permissions:
  contents: write

concurrency:
  group: import-aicouncil-archive
  cancel-in-progress: false

jobs:
  import-project:
    # The import commit removes the uploaded ZIP; skip that follow-up push to avoid re-triggering without an archive.
    if: ${{ !startsWith(github.event.head_commit.message, 'Import and verify AI Council Android ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Safely extract project archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(AI-Council-Android-v*-files.zip)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one AI-Council-Android-v*-files.zip archive in the repository root; found ${#archives[@]}."
            printf 'Found: %s\n' "${archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          version="${archive#AI-Council-Android-}"
          version="${version%-files.zip}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -s "$archive"

          # Keep this workflow authoritative if the archive contains an older copy.
          workflow_backup="$(mktemp)"
          cp .github/workflows/import-project-archive.yml "$workflow_backup"

          python3 - "$archive" <<'PY'
          import os
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]
          destination = "/tmp/aicouncil-project"
          max_entries = 20000
          max_uncompressed = 500 * 1024 * 1024
          os.makedirs(destination, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if len(entries) > max_entries:
                  raise SystemExit(f"Archive has too many entries: {len(entries)}")
              total = 0
              for info in entries:
                  p = PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts or not p.parts:
                      raise SystemExit(f"Unsafe path in archive: {info.filename!r}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not allowed: {info.filename!r}")
                  total += info.file_size
                  if total > max_uncompressed:
                      raise SystemExit("Archive expands beyond the 500 MiB safety limit")
              z.extractall(destination)

          print(f"Extracted {len(entries)} entries ({total} bytes uncompressed)")
          PY

          cp -a /tmp/aicouncil-project/. .
          mkdir -p .github/workflows
          cp "$workflow_backup" .github/workflows/import-project-archive.yml
          rm -f "$workflow_backup" "$archive"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6.4'

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -d app || { echo "::error::Missing app/ directory after extraction."; exit 1; }
          if [[ -f tools/verify_project.py ]]; then
            python3 tools/verify_project.py
          else
            echo "::warning::tools/verify_project.py is absent; static verifier skipped."
          fi

      - name: Desktop smoke tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/desktop_smoke/run.sh ]]; then
            sh tools/desktop_smoke/run.sh
          else
            echo "::notice::No desktop smoke-test script in this archive."
          fi
        env:
          JAVA_TOOL_OPTIONS: -XX:+UseSerialGC

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Create APK checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-android-${{ steps.extract.outputs.version }}-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated source project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Import and verify AI Council Android ${{ steps.extract.outputs.version }} source"
          git push
