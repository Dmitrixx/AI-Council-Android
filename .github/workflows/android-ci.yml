name: Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradlew'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradlew'
      - 'settings.gradle*'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: ${{ hashFiles('app/**') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '7.6.4'

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon testDebugUnitTest assembleDebug
          else
            gradle --no-daemon testDebugUnitTest assembleDebug
          fi

      - name: Run Android lint when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            task_list="$(./gradlew --no-daemon tasks --all)"
            if grep -q 'lintDebug' <<< "$task_list"; then
              ./gradlew --no-daemon lintDebug
            else
              echo "::notice::lintDebug task is not available in this project."
            fi
          else
            task_list="$(gradle --no-daemon tasks --all)"
            if grep -q 'lintDebug' <<< "$task_list"; then
              gradle --no-daemon lintDebug
            else
              echo "::notice::lintDebug task is not available in this project."
            fi
          fi

      - name: Generate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-android-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
