name: Build AI Council APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Council-Android-*.zip"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "app/**"
      - "tools/**"
      - ".github/workflows/android-build.yml"
      - ".github/scripts/**"
      - "README.md"
      - "README_RU.md"
      - "CHANGELOG_RU.md"
  pull_request:
    paths:
      - "AI-Council-Android-*.zip"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "app/**"
      - "tools/**"
      - ".github/scripts/**"
      - "README.md"
      - "README_RU.md"
      - "CHANGELOG_RU.md"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            archive="$(find . -maxdepth 1 -type f -name 'AI-Council-Android-*.zip' -print -quit)"
            if [[ -z "$archive" ]]; then echo "::error::Android source not found."; exit 1; fi
            mkdir -p .build-source
            unzip -q "$archive" -d .build-source
            settings="$(find .build-source -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            echo "project_dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"
          fi

      - name: Align version metadata to 2.4.2
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          TARGET = "2.4.2"
          CODE = 71
          activity = Path("app/src/main/java/com/aicouncil/app/MainActivity.java")
          content = activity.read_text(encoding="utf-8")
          content2, n = re.subn(r'APP_VERSION = "[^"]+"', 'APP_VERSION = "%s"' % TARGET, content, count=1)
          if n == 0 and ('APP_VERSION = "%s"' % TARGET) not in content:
              raise SystemExit("APP_VERSION not found")
          activity.write_text(content2, encoding="utf-8")
          gradle = Path("app/build.gradle")
          gt = gradle.read_text(encoding="utf-8")
          gt = re.sub(r"versionCode \d+", "versionCode %d" % CODE, gt, count=1)
          gt = re.sub(r"versionName '[^']+'", "versionName '%s'" % TARGET, gt, count=1)
          gradle.write_text(gt, encoding="utf-8")
          verify = Path("tools/verify_project.py")
          vt = verify.read_text(encoding="utf-8")
          for code in range(72, 47, -1):
              vt = vt.replace("versionCode %d" % code, "versionCode %d" % CODE)
          for old in ("2.4.1", "2.4.0", "2.3.4", "2.3.3", "2.3.2"):
              vt = vt.replace("versionName '%s'" % old, "versionName '%s'" % TARGET)
              vt = vt.replace('APP_VERSION = "%s"' % old, 'APP_VERSION = "%s"' % TARGET)
              vt = vt.replace("# AI Council %s" % old, "# AI Council %s" % TARGET)
              vt = vt.replace("Версия Java — %s" % old, "Версия Java — %s" % TARGET)
              vt = vt.replace("до %s" % old, "до %s" % TARGET)
              vt = vt.replace("%s / code 69" % old, "%s / code %d" % (TARGET, CODE))
              vt = vt.replace("%s / code 70" % old, "%s / code %d" % (TARGET, CODE))
              vt = vt.replace("— %s / code 69" % old, "— %s / code %d" % (TARGET, CODE))
          vt = vt.replace("2.4.0 / code 69", "%s / code %d" % (TARGET, CODE))
          vt = vt.replace("2.4.1 / code 70", "%s / code %d" % (TARGET, CODE))
          verify.write_text(vt, encoding="utf-8")
          for name in ("README.md", "README_RU.md"):
              p = Path(name)
              if not p.exists():
                  continue
              rt = p.read_text(encoding="utf-8")
              if not rt.startswith("# AI Council " + TARGET):
                  rt = re.sub(r"^# AI Council [^\n]+", "# AI Council " + TARGET, rt, count=1)
                  p.write_text(rt, encoding="utf-8")
          print("aligned to", TARGET, CODE)
          PY

      - name: Fix PDFBox-Android imports for production and smoke stubs
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/java/com/aicouncil/app/DocumentTextExtractor.java app/src/main/java/com/aicouncil/app/ocr/OcrDocumentProcessor.java; do
            test -f "$file"
            sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$file"
          done

      - name: Apply MainActivity policy extracts (idempotent; permanent on main)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_all.py" "${{ steps.source.outputs.project_dir }}"

      - name: Apply robust final-answer recovery to CouncilExecutionEngine
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_robust_final_answer.py" "${{ steps.source.outputs.project_dir }}"

      - name: Enhance coordinator synthesis and tool-aware prompts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_enhanced_synthesis.py" "${{ steps.source.outputs.project_dir }}"

      - name: Add user-configurable PDF OCR page limit (5 / 20)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_ocr_pdf_page_limit.py" "${{ steps.source.outputs.project_dir }}"

      - name: Restore static-verify marker strings in MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_verify_markers.py" "${{ steps.source.outputs.project_dir }}"

      - name: Add Android UI instrumentation tests and accessibility state
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_android_ui_smoke_tests.py" "${{ steps.source.outputs.project_dir }}"

      - name: Package corrected source for reproducibility
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: zip -qr "$RUNNER_TEMP/AI-Council-Android-source.zip" .

      - name: Upload pre-build source snapshot for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-source-snapshot-${{ github.run_number }}
          path: ${{ runner.temp }}/AI-Council-Android-source.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and force Java 21
        run: |
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Static verification
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: python3 tools/verify_project.py

      - name: Desktop smoke tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: sh tools/desktop_smoke/run.sh
        env:
          JAVA_TOOL_OPTIONS: -XX:+UseSerialGC

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then chmod +x ./gradlew; ./gradlew --no-daemon --stacktrace assembleDebug
          else gradle --no-daemon --stacktrace assembleDebug; fi

      - name: Verify APK and create checksum
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-debug-apk-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
