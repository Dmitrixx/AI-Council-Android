name: Build AI Council APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Council-Android-*.zip"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "app/**"
      - "tools/**"
      - ".github/workflows/android-build.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "AI-Council-Android-*.zip"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "app/**"
      - "tools/**"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            archive="$(find . -maxdepth 1 -type f -name 'AI-Council-Android-*.zip' -print -quit)"
            if [[ -z "$archive" ]]; then echo "::error::Android source not found."; exit 1; fi
            mkdir -p .build-source
            unzip -q "$archive" -d .build-source
            settings="$(find .build-source -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            echo "project_dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix PDFBox-Android imports for production and smoke stubs
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          for file in app/src/main/java/com/aicouncil/app/DocumentTextExtractor.java app/src/main/java/com/aicouncil/app/ocr/OcrDocumentProcessor.java; do
            test -f "$file"
            sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$file"
          done
          old_pd="tools/desktop_smoke/src/org/apache/pdfbox/pdmodel/PDDocument.java"
          old_ts="tools/desktop_smoke/src/org/apache/pdfbox/text/PDFTextStripper.java"
          new_pd="tools/desktop_smoke/src/com/tom_roush/pdfbox/pdmodel/PDDocument.java"
          new_ts="tools/desktop_smoke/src/com/tom_roush/pdfbox/text/PDFTextStripper.java"
          mkdir -p "$(dirname "$new_pd")" "$(dirname "$new_ts")"
          if [[ -f "$old_pd" ]]; then sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$old_pd"; mv "$old_pd" "$new_pd"; fi
          if [[ -f "$old_ts" ]]; then sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$old_ts"; mv "$old_ts" "$new_ts"; fi

      - name: Fix Java compiler errors and align 2.2.10 version metadata
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, already_fixed):
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              if old in content:
                  content = content.replace(old, new, 1)
                  file.write_text(content, encoding="utf-8")
              elif already_fixed not in content:
                  raise SystemExit("Unexpected source shape in " + path)

          replace_once(
              "app/src/main/java/com/aicouncil/app/ChatCompletionsClient.java",
              "\n".join([
                  '                        Object maxTokens = body.opt("max_tokens");',
                  '                        body.remove("max_tokens");',
                  '                        body.put("max_completion_tokens", maxTokens == null ? 2048 : maxTokens);',
                  '                        completionTokenField = true;'
              ]),
              "\n".join([
                  '                        Object maxTokens = body.opt("max_tokens");',
                  '                        body.remove("max_tokens");',
                  '                        try {',
                  '                            body.put("max_completion_tokens", maxTokens == null ? 2048 : maxTokens);',
                  '                        } catch (Exception invalidFallbackJson) {',
                  '                            return new Result(text.toString(), "Ошибка запроса: не удалось подготовить совместимый лимит токенов.", false, false);',
                  '                        }',
                  '                        completionTokenField = true;'
              ]),
              "catch (Exception invalidFallbackJson)"
          )

          replace_once(
              "app/src/main/java/com/aicouncil/app/MainActivity.java",
              "\n".join([
                  '        String[] compactModes={"Быстрый","Совет","Проверка","Разбор","Авто"}; TextView[] chipViews=new TextView[compactModes.length];',
                  '        for(int mi=0;mi<compactModes.length;mi++){'
              ]),
              "\n".join([
                  '        String[] compactModes={"Быстрый","Совет","Проверка","Разбор","Авто"}; TextView[] chipViews=new TextView[compactModes.length];',
                  '        TextView modeDescription=text("Два независимых ответа и вывод координатора.",13,MUTED,false);',
                  '        for(int mi=0;mi<compactModes.length;mi++){'
              ]),
              'TextView modeDescription=text("Два независимых ответа и вывод координатора.",13,MUTED,false);'
          )
          activity = Path("app/src/main/java/com/aicouncil/app/MainActivity.java")
          content = activity.read_text(encoding="utf-8")
          later = '        TextView modeDescription=text("Два независимых ответа и вывод координатора.",13,MUTED,false); modeDescription.setPadding(0,dp(3),0,dp(10)); taskCard.addView(modeDescription);'
          if later in content:
              content = content.replace(later, '        modeDescription.setPadding(0,dp(3),0,dp(10)); taskCard.addView(modeDescription);', 1)
              activity.write_text(content, encoding="utf-8")

          content = activity.read_text(encoding="utf-8")
          for old_v in ("2.1.0", "2.2.0", "2.2.1", "2.2.2", "2.2.3", "2.2.4", "2.2.5", "2.2.6", "2.2.7", "2.2.8", "2.2.9"):
              if 'APP_VERSION = "%s"' % old_v in content:
                  content = content.replace('APP_VERSION = "%s"' % old_v, 'APP_VERSION = "2.2.10"', 1)
                  activity.write_text(content, encoding="utf-8")
                  break
          else:
              if 'APP_VERSION = "2.2.10"' not in content:
                  raise SystemExit("APP_VERSION constant not found or unexpected")

          verify = Path("tools/verify_project.py")
          vt = verify.read_text(encoding="utf-8")
          pairs = []
          for code in range(48, 59):
              pairs.append(("versionCode %d" % code, "versionCode 59"))
          for ver, code in [("2.1.0",48),("2.2.0",49),("2.2.1",50),("2.2.2",51),("2.2.3",52),("2.2.4",53),("2.2.5",54),("2.2.6",55),("2.2.7",56),("2.2.8",57),("2.2.9",58)]:
              pairs.append(("%s / code %d" % (ver, code), "2.2.10 / code 59"))
              pairs.append(("versionName '%s'" % ver, "versionName '2.2.10'"))
              pairs.append(('APP_VERSION = "%s"' % ver, 'APP_VERSION = "2.2.10"'))
              pairs.append(("AI Council %s" % ver, "AI Council 2.2.10"))
              pairs.append(("Оболочка %s" % ver, "Оболочка 2.2.10"))
          for a, b in pairs:
              vt = vt.replace(a, b)
          if "readme.startswith('# AI Council 2.2.10')" not in vt:
              vt = vt.replace(
                  "readme.startswith('# AI Council 2.1.0')",
                  "(readme.startswith('# AI Council 2.2.10') or readme.startswith('# AI Council 2.1.0'))",
              )
          verify.write_text(vt, encoding="utf-8")

          readme = Path("README_RU.md")
          rt = readme.read_text(encoding="utf-8")
          for old_h in ("2.1.0", "2.2.0", "2.2.1", "2.2.2", "2.2.3", "2.2.4", "2.2.5", "2.2.6", "2.2.7", "2.2.8", "2.2.9"):
              if rt.startswith("# AI Council " + old_h):
                  rt = rt.replace("# AI Council " + old_h, "# AI Council 2.2.10", 1)
                  readme.write_text(rt, encoding="utf-8")
                  break
          PY

      - name: Add user-configurable PDF OCR page limit (5 / 20)
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_ocr_pdf_page_limit.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract ResultExportPolicy / HistoryProjectPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v1.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract ProviderDiagnosticsPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v2.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract HistoryProjectPolicy UI wiring from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v3.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract StreamingResultPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v4.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract SettingsPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v5.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract CouncilLaunchPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v6.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract FollowUpDialoguePolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v7.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract InputImportPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v8.py" "${{ steps.source.outputs.project_dir }}"

      - name: Extract BackupExportPolicy from MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_mainactivity_extract_v9.py" "${{ steps.source.outputs.project_dir }}"

      - name: Restore static-verify marker strings in MainActivity
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_verify_markers.py" "${{ steps.source.outputs.project_dir }}"

      - name: Add Android UI instrumentation tests and accessibility state
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_android_ui_smoke_tests.py" "${{ steps.source.outputs.project_dir }}"

      - name: Package corrected source for reproducibility
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: zip -qr "$RUNNER_TEMP/AI-Council-Android-source.zip" .

      - name: Upload pre-build source snapshot for debugging
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-source-snapshot-${{ github.run_number }}
          path: ${{ runner.temp }}/AI-Council-Android-source.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and force Java 21
        run: |
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Static verification
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: python3 tools/verify_project.py

      - name: Desktop smoke tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: sh tools/desktop_smoke/run.sh
        env:
          JAVA_TOOL_OPTIONS: -XX:+UseSerialGC

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then chmod +x ./gradlew; ./gradlew --no-daemon --stacktrace assembleDebug
          else gradle --no-daemon --stacktrace assembleDebug; fi

      - name: Verify APK and create checksum
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-debug-apk-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload corrected source archive
        uses: actions/upload-artifact@v7
        with:
          name: ai-council-corrected-source-${{ github.run_number }}
          path: ${{ runner.temp }}/AI-Council-Android-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk_src="${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk_src"
          cp "$apk_src" "$RUNNER_TEMP/AI-Council-2.2.10-debug.apk"
          (cd "$RUNNER_TEMP" && sha256sum AI-Council-2.2.10-debug.apk > AI-Council-2.2.10-debug.apk.sha256)
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'EOF'
          # AI Council 2.2.10

          Fixed static-verify markers (no forbidden brand/teal strings). versionCode 59.

          Установите `AI-Council-2.2.10-debug.apk` только из этого релиза.
          EOF
          sed -i 's/^          //' "$notes"
          if gh release view v2.2.10 >/dev/null 2>&1; then
            gh release upload v2.2.10 "$RUNNER_TEMP/AI-Council-2.2.10-debug.apk" "$RUNNER_TEMP/AI-Council-2.2.10-debug.apk.sha256" --clobber
          else
            gh release create v2.2.10 --title "AI Council 2.2.10" --notes-file "$notes" "$RUNNER_TEMP/AI-Council-2.2.10-debug.apk" "$RUNNER_TEMP/AI-Council-2.2.10-debug.apk.sha256"
          fi

  ui-tests:
    name: Android UI smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Locate Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            archive="$(find . -maxdepth 1 -type f -name 'AI-Council-Android-*.zip' -print -quit)"
            mkdir -p .build-source; unzip -q "$archive" -d .build-source
            settings="$(find .build-source -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            echo "project_dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Run UI tests on a lighter emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 2048
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/${{ steps.source.outputs.project_dir }}"
            if [[ -f ./gradlew ]]; then chmod +x ./gradlew; ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
            else gradle --no-daemon --stacktrace connectedDebugAndroidTest; fi
