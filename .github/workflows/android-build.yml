name: Build AI Council APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AI-Council-Android-v2.0.0-*.zip"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "app/**"
      - "tools/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "AI-Council-Android-v2.0.0-*.zip"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "build.gradle"
      - "build.gradle.kts"
      - "app/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            archive="$(find . -maxdepth 1 -type f -name 'AI-Council-Android-v2.0.0-*.zip' -print -quit)"
            if [[ -z "$archive" ]]; then
              echo "::error::Android source not found. Upload AI-Council-Android-v2.0.0-hybrid-pdf.zip to the repository root, then push again."
              exit 1
            fi
            mkdir -p .build-source
            unzip -q "$archive" -d .build-source
            settings="$(find .build-source -maxdepth 4 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -z "$settings" ]]; then
              echo "::error::The source ZIP does not contain settings.gradle or settings.gradle.kts."
              exit 1
            fi
            echo "project_dir=$(dirname "$settings")" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix PDFBox-Android imports for production and smoke stubs
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          production_files=(
            app/src/main/java/com/aicouncil/app/DocumentTextExtractor.java
            app/src/main/java/com/aicouncil/app/ocr/OcrDocumentProcessor.java
          )
          for file in "${production_files[@]}"; do
            test -f "$file"
            sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$file"
          done

          old_pd="tools/desktop_smoke/src/org/apache/pdfbox/pdmodel/PDDocument.java"
          old_ts="tools/desktop_smoke/src/org/apache/pdfbox/text/PDFTextStripper.java"
          new_pd="tools/desktop_smoke/src/com/tom_roush/pdfbox/pdmodel/PDDocument.java"
          new_ts="tools/desktop_smoke/src/com/tom_roush/pdfbox/text/PDFTextStripper.java"
          mkdir -p "$(dirname "$new_pd")" "$(dirname "$new_ts")"
          if [[ -f "$old_pd" ]]; then
            sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$old_pd"
            mv "$old_pd" "$new_pd"
          fi
          if [[ -f "$old_ts" ]]; then
            sed -i 's/org\.apache\.pdfbox/com.tom_roush.pdfbox/g' "$old_ts"
            mv "$old_ts" "$new_ts"
          fi
          if grep -R -n 'org\.apache\.pdfbox' app/src/main/java/com/aicouncil/app; then
            echo "::error::Desktop PDFBox package imports remain in Android production source."
            exit 1
          fi
          test -f "$new_pd"
          test -f "$new_ts"

      - name: Fix Java compiler errors found by the Android build
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          chat_path = Path("app/src/main/java/com/aicouncil/app/ChatCompletionsClient.java")
          chat = chat_path.read_text(encoding="utf-8")
          old_chat = '''                        Object maxTokens = body.opt("max_tokens");
                        body.remove("max_tokens");
                        body.put("max_completion_tokens", maxTokens == null ? 2048 : maxTokens);
                        completionTokenField = true;'''
          new_chat = '''                        Object maxTokens = body.opt("max_tokens");
                        body.remove("max_tokens");
                        try {
                            body.put("max_completion_tokens", maxTokens == null ? 2048 : maxTokens);
                        } catch (Exception invalidFallbackJson) {
                            return new Result(text.toString(), "Ошибка запроса: не удалось подготовить совместимый лимит токенов.", false, false);
                        }
                        completionTokenField = true;'''
          if old_chat in chat:
              chat = chat.replace(old_chat, new_chat, 1)
              chat_path.write_text(chat, encoding="utf-8")
          elif "catch (Exception invalidFallbackJson)" not in chat:
              raise SystemExit("ChatCompletionsClient fallback block did not match expected source")

          activity_path = Path("app/src/main/java/com/aicouncil/app/MainActivity.java")
          activity = activity_path.read_text(encoding="utf-8")
          old_start = '''        String[] compactModes={"Быстрый","Совет","Проверка","Разбор","Авто"}; TextView[] chipViews=new TextView[compactModes.length];
        for(int mi=0;mi<compactModes.length;mi++){'''
          new_start = '''        String[] compactModes={"Быстрый","Совет","Проверка","Разбор","Авто"}; TextView[] chipViews=new TextView[compactModes.length];
        TextView modeDescription=text("Два независимых ответа и вывод координатора.",13,MUTED,false);
        for(int mi=0;mi<compactModes.length;mi++){'''
          old_decl = '''        TextView modeDescription=text("Два независимых ответа и вывод координатора.",13,MUTED,false); modeDescription.setPadding(0,dp(3),0,dp(10)); taskCard.addView(modeDescription);'''
          new_decl = '''        modeDescription.setPadding(0,dp(3),0,dp(10)); taskCard.addView(modeDescription);'''
          if old_start in activity and old_decl in activity:
              activity = activity.replace(old_start, new_start, 1)
              activity = activity.replace(old_decl, new_decl, 1)
              activity_path.write_text(activity, encoding="utf-8")
          elif activity.find("TextView modeDescription=text(") < activity.find("for(int mi=0;mi<compactModes.length;mi++)") and new_decl in activity:
              pass
          else:
              raise SystemExit("MainActivity modeDescription declaration could not be repaired safely")

          verify_path = Path("tools/verify_project.py")
          verify = verify_path.read_text(encoding="utf-8")
          anchor = """check('Облачные chat-запросы используют OkHttp и SSE stream=true вне Activity', CHAT_CLIENT.exists() and 'OkHttpClient' in CHAT_CLIENT.read_text(encoding='utf-8') and 'body.put("stream", true)' in src and 'HttpURLConnection' not in CHAT_CLIENT.read_text(encoding='utf-8'))"""
          add = anchor + "\\ncheck('Переименование max_tokens в max_completion_tokens обрабатывает JSONException', 'catch (Exception invalidFallbackJson)' in CHAT_CLIENT.read_text(encoding='utf-8'))\\ncheck('Описание режима объявлено до обработчиков кнопок режимов', src.find('TextView modeDescription=text(') < src.find('for(int mi=0;mi<compactModes.length;mi++)'))"
          if anchor in verify:
              verify_path.write_text(verify.replace(anchor, add, 1), encoding="utf-8")
          elif "Переименование max_tokens в max_completion_tokens обрабатывает JSONException" not in verify:
              raise SystemExit("Could not add compiler regression checks to verify_project.py")
          PY

      - name: Package corrected source for reproducibility
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: zip -qr "$RUNNER_TEMP/AI-Council-Android-v2.0.0-pdfbox-fixed.zip" .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify and force Java 21
        run: |
          echo "JAVA_HOME before=$JAVA_HOME"
          java -version
          # Make sure the PATH prefers the Java 21 we just installed
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          java -version
          which java

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Static verification
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: python3 tools/verify_project.py

      - name: Desktop smoke tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: sh tools/desktop_smoke/run.sh
        env:
          JAVA_TOOL_OPTIONS: -XX:+UseSerialGC

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          echo "=== Build environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          which java
          gradle --version || true
          echo "========================="
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK and create checksum
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-debug-apk-${{ github.run_number }}
          path: |
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload corrected source archive
        uses: actions/upload-artifact@v4
        with:
          name: ai-council-corrected-source-${{ github.run_number }}
          path: ${{ runner.temp }}/AI-Council-Android-v2.0.0-pdfbox-fixed.zip
          if-no-files-found: error
          retention-days: 14
