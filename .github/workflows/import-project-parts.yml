name: Import Android source from archive parts

on:
  push:
    branches: [main]
    paths:
      - 'AI-Council-Android-ARCHIVE_READY.txt'

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rebuild and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f AI-Council-Android-ARCHIVE_READY.txt
          cat .aicouncil_archive_parts/part-*.txt | base64 --decode > /tmp/aicouncil-project.zip
          unzip -t /tmp/aicouncil-project.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          archive = "/tmp/aicouncil-project.zip"
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe path in archive: {name}")
              z.extractall("/tmp/aicouncil-project")
          PY
          cp -a /tmp/aicouncil-project/. .
          rm -f AI-Council-Android-ARCHIVE_READY.txt
          rm -rf .aicouncil_archive_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AI Council Android v1.32.0 source"
          git push